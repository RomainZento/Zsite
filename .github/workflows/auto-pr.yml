name: Auto PR + Notification

on:
  push:
    branches:
      - 'features/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request
        id: cpr
        # On utilise l'outil CLI de GitHub qui est pré-installé sur les runners
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # On tente de créer la PR. Si elle existe déjà, la commande échouera proprement.
          pr_url=$(gh pr create \
            --base develop \
            --head ${{ github.ref_name }} \
            --title "PR: ${{ github.ref_name }}" \
            --body "PR créée automatiquement suite au push" \
            2>/dev/null || gh pr view ${{ github.ref_name }} --json url -q .url)
          
          echo "pr_url=$pr_url" >> $GITHUB_OUTPUT

      - name: Send email
        if: steps.cpr.outputs.pr_url != ''
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Nouvelle PR à valider - ${{ github.ref_name }}
          to: ${{ secrets.MAIL_TO }}
          from: GitHub Actions
          body: |
            Une Pull Request est prête pour revue.

            Branche : ${{ github.ref_name }}
            Lien : ${{ steps.cpr.outputs.pr_url }}