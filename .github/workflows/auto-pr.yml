name: Auto PR + Notification

on:
  push:
    branches:
      - 'features/**'

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # On récupère tout l'historique pour permettre la comparaison avec 'develop'
          fetch-depth: 0
          # On s'assure d'être sur la branche qui a déclenché le push
          ref: ${{ github.ref_name }}

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          base: develop
          # Utilisation d'un nom de branche unique pour la PR
          branch: pr-automated-${{ github.ref_name }}
          title: "PR: ${{ github.ref_name }}"
          body: "PR créée automatiquement suite au push sur ${{ github.ref_name }}"
          commit-message: "docs: automated PR creation"

      - name: Send email
        # On n'envoie le mail QUE si une PR a été créée ou modifiée
        if: steps.cpr.outputs.pull-request-operation != 'none'
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Nouvelle PR à valider - ${{ github.ref_name }}
          to: ${{ secrets.MAIL_USERNAME }}
          from: GitHub Actions
          body: |
            Une Pull Request a été générée automatiquement.

            Branche source : ${{ github.ref_name }}
            Branche cible : develop

            Lien de la PR :
            ${{ steps.cpr.outputs.pull-request-url }}